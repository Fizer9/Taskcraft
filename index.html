<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taskcraft</title>
    <!-- Установка как приложение: значок на главный экран, окно без адресной строки. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1c1814" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Taskcraft" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header id="topbar">
      <div class="menu">
        <button data-action="open-quests" title="Журнал заданий (F9)">Задания</button>
        <button data-action="open-settings" id="menu-btn" title="Настройки (F10)">Меню</button>
        <button data-action="toggle-side" title="Свитки (Ё)">Свитки</button>
      </div>
      <div id="clock"></div>
      <div id="daydial"><div class="dial-wheel"><i class="sun"></i><i class="moon"></i></div></div>
      <div id="resources"></div>
    </header>

    <aside id="side">
      <h2>Свитки</h2>
      <form id="new-scroll" autocomplete="off">
        <input name="title" placeholder="Новый свиток, Enter" maxlength="200" title="Можно сразу: #проект !уровень @завтра. Например: Купить продукты #cook !1 @пт" />
      </form>
      <div id="side-filter">
        <input id="filter-q" type="search" placeholder="Поиск по свиткам ( / )" maxlength="100" />
        <div class="filter-row">
          <select id="filter-project" title="Проект"></select>
          <select id="filter-level" title="Уровень"></select>
          <select id="filter-status" title="Статус"></select>
        </div>
      </div>
      <div id="side-list"></div>
    </aside>

    <!-- Кнопки героев слева сверху и значок простаивающих баз, как в WC3. -->
    <div id="left-icons">
      <div id="hero-buttons"></div>
      <button id="idle-bases" data-action="idle-base" hidden></button>
    </div>
    <div id="quest-done"></div>

    <div id="guard"></div>
    <div id="messages"></div>

    <footer id="console">
      <div class="frame minimap-frame"><canvas id="minimap" width="180" height="180"></canvas></div>
      <div class="frame minimap-buttons" id="minimap-buttons"></div>
      <div class="frame portrait-frame">
        <div id="portrait"></div>
        <div id="hero-bars"></div>
      </div>
      <div class="frame info-frame"><div id="info"></div></div>
      <div class="frame inventory-frame" id="inventory"></div>
      <div class="frame card-frame"><div id="command-card"></div></div>
    </footer>

    <div id="tooltip"></div>
    <div id="modal-root"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
