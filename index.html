<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskcraft</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header id="topbar">
      <div class="menu">
        <button data-action="open-settings" title="Настройки (F10)">Меню</button>
        <button data-action="toggle-side" title="Свитки (F9)">Свитки</button>
      </div>
      <div id="clock"></div>
      <div id="resources"></div>
    </header>

    <aside id="side">
      <h2>Свитки</h2>
      <form id="new-scroll" autocomplete="off">
        <input name="title" placeholder="Новый свиток, Enter" maxlength="200" />
      </form>
      <div id="side-list"></div>
    </aside>

    <div id="guard"></div>
    <div id="messages"></div>

    <footer id="console">
      <div class="frame minimap-frame"><canvas id="minimap" width="180" height="180"></canvas></div>
      <div class="frame portrait-frame">
        <div id="portrait"></div>
        <div id="hero-bars"></div>
      </div>
      <div class="frame info-frame"><div id="info"></div></div>
      <div class="frame card-frame"><div id="command-card"></div></div>
    </footer>

    <div id="tooltip"></div>
    <div id="modal-root"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
